[versions]
java = "21"
kotlin = "2.3.20"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.11.0"
moddev = "2.0.141"
loom = "1.16-SNAPSHOT"
dokka = "2.2.0"

minecraft = "1.21.1"
minecraftRange = "[1.21.1]"

# Cobble specific
graal = "22.3.0"
icu4j = "71.1"
regex = "22.3.0"
truffle = "22.3.0"

# Required for common
neoForm = "1.21.1-20240808.144430"
mixin = "0.8.5"
mixinExtras = "0.5.4"
# Parchment for proper remapping in common source
parchment = "2024.11.17"
parchmentMC = "1.21.1"

# Neoforge specific
neoforge = "21.1.182"
neoforgeRange = "[21.1, 21.2)"
kff = "5.11.0"
kffRange = "[5.11, )"

# Fabric specific
fabricLoader = "0.17.2"
fabricApi = "0.116.11+1.21.1"
flk = "1.13.10+kotlin.2.3.20"

cobblemon = "1.7.3+1.21.1"
cobblemonSnap = "1.8.0+1.21.1-SNAPSHOT"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabricLoader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabricLoader" }
fabricApi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabricApi" }
flk = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "flk" }
kff = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kff" }
kff-lang = { group = "thedarkcolour", name = "kfflang-neoforge", version.ref = "kff" }
kff-lib = { group = "thedarkcolour", name = "kfflib-neoforge", version.ref = "kff" }
kff-mod = { group = "thedarkcolour", name = "kffmod-neoforge", version.ref = "kff" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinExtras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinExtras" }
cobblemon-common = { group = "com.cobblemon", name = "mod", version.ref = "cobblemon" }
cobblemon-fabric = { group = "com.cobblemon", name = "fabric", version.ref = "cobblemon" }
cobblemon-neoforge = { group = "com.cobblemon", name = "neoforge", version.ref = "cobblemon" }
cobblemon-common-snap = { group = "com.cobblemon", name = "mod", version.ref = "cobblemonSnap" }
cobblemon-fabric-snap = { group = "com.cobblemon", name = "fabric", version.ref = "cobblemonSnap" }
cobblemon-neoforge-snap = { group = "com.cobblemon", name = "neoforge", version.ref = "cobblemonSnap" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Graal
graal-core = { group = "org.graalvm.js", name = "js", version.ref = "graal" }
graal-sdk = { group = "org.graalvm.sdk", name = "graal-sdk", version.ref = "graal" }
graal-regex = { group = "org.graalvm.regex", name = "regex", version.ref = "graal"}
graal-truffle = { group = "org.graalvm.truffle", name = "truffle-api", version.ref = "graal" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
loom = { id = "fabric-loom", version.ref = "loom" }

[bundles]
kff = ["kff-lang", "kff-lib", "kff-mod"]
graal = [ "graal-core", "graal-sdk", "graal-regex", "graal-truffle", "icu4j" ]
neo-kotlin-stdlib = ["kotlin-stdlib", "kotlin-reflect", "kotlinx-coroutines-core", "kotlinx-serialization-core", "kotlinx-serialization-json"]